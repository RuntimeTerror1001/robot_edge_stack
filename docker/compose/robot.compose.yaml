services:
  # --------------------------------------------------------
  # DISCOVERY SERVER
  # --------------------------------------------------------
  discovery:
    image: robot_edge_stack_discovery:humble
    network_mode: host
    restart: unless-stopped
    runtime: nvidia
    environment:
      - ROS_DOMAIN_ID=42
      - FASTRTPS_DEFAULT_PROFILES_FILE=/ws/fastdds/server_fastdds.xml
    volumes:
      - ./fastdds:/ws/fastdds:ro
    command: >
      bash -lc "fastdds discovery -i 0"

  # --------------------------------------------------------
  # SKELETON (Testing)
  # --------------------------------------------------------
  skeleton:
    image: robot_edge_stack_base:humble
    network_mode: host
    restart: unless-stopped
    runtime: nvidia
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/ws/fastdds/jetson_fastdds.xml
    volumes:
      - ./:/ws:rw
    depends_on:
      - discovery
    command: >
      bash -lc "ros2 topic pub /heartbeat std_msgs/msg/String \"{data: 'alive'}\""

  # --------------------------------------------------------
  # FRONT CAMERA
  # --------------------------------------------------------
  camera_front:
    image: robot_edge_stack_camera:humble
    network_mode: host
    restart: unless-stopped
    runtime: nvidia
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/ws/fastdds/jetson_fastdds.xml
    volumes:
      - ./fastdds:/ws/fastdds:ro
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
    group_add:
      - video
    depends_on:
      - discovery
    command:
      - bash
      - -lc
      - |
        ros2 run usb_cam usb_cam_node_exe \
          --ros-args \
          -r "__ns:=/front_camera" \
          -r "__node:=usb_cam_front" \
          -p "video_device:=/dev/video0" \
          -p "image_width:=640" \
          -p "image_height:=480" \
          -p "framerate:=15.0" \
          -p "pixel_format:=mjpeg2rgb" \
          -p "camera_name:=front_camera"

  # --------------------------------------------------------
  # REAR CAMERA
  # --------------------------------------------------------
  camera_rear:
    image: robot_edge_stack_camera:humble
    network_mode: host
    restart: unless-stopped
    runtime: nvidia
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/ws/fastdds/jetson_fastdds.xml
    volumes:
      - ./fastdds:/ws/fastdds:ro
    devices:
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
    group_add:
      - video
    depends_on:
      - discovery
    command:
      - bash
      - -lc
      - |
        ros2 run usb_cam usb_cam_node_exe \
          --ros-args \
          -r "__ns:=/rear_camera" \
          -r "__node:=usb_cam_rear" \
          -p "video_device:=/dev/video2" \
          -p "image_width:=640" \
          -p "image_height:=480" \
          -p "framerate:=15.0" \
          -p "pixel_format:=mjpeg2rgb" \
          -p "camera_name:=rear_camera"

  # --------------------------------------------------------
  # SYSTEM METRICS (publishes /system/metrics)
  # --------------------------------------------------------
  system_metrics:
    image: robot_edge_stack_base:humble
    network_mode: host
    restart: unless-stopped
    runtime: nvidia
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/ws/fastdds/jetson_fastdds.xml
    volumes:
      - ./:/ws:rw
      - /usr/bin/tegrastats:/usr/bin/tegrastats:ro
    depends_on:
      - discovery
    command: |
      bash -lc "
        cd /ws &&
        colcon build --packages-select stack_msgs health_monitor --cmake-args -DCMAKE_BUILD_TYPE=Release &&
        source install/setup.bash &&
        ros2 run health_monitor system_metrics
      "
  
  # --------------------------------------------------------
  # WATCHDOG (monitors all nodes, restarts dead containers)
  # --------------------------------------------------------
  watchdog:
    image: robot_edge_stack_base:humble
    network_mode: host
    restart: unless-stopped
    runtime: nvidia
    environment: 
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/ws/fastdds/jetson_fastdds.xml
    volumes:
      - ./:/ws:rw
      - /var/run/docker.sock:/var/run/docker,sock
    depends_on:
      - discovery
      - camera_front
      - camera_rear
      - skeleton
    command: |
      bash -lc "
        cd /ws &&
        colcon build --packages-select stack_msgs health_monitor --cmake-args -DCMAKE_BUILD_TYPE=Release &&
        source install/setup.bash &&
        ros2 run health_monitor watchdog --ros-args -p compose_project_dir:=/ws
      "

  # --------------------------------------------------------
  # BANDWIDTH MANAGER (adaptive FPS control)
  # --------------------------------------------------------
  bandwidth_manager:
    image: robot_edge_stack_base:humble
    network_mode: host
    restart: unless-stopped
    runtime: nvidia
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/ws/fastdds/jetson_fastdds.xml
    volumes:
      - ./:/ws:rw
    depends_on:
      - discovery
      - system_metrics
    command: |
      bash -lc "
        cd /ws &&
        colcon build --packages-select stack_msgs health_monitor bandwidth_manager --cmake-args -DCMAKE_BUILD_TYPE=Release &&
        source install/setup.bash &&
        ros2 run bandwidth_manager bandwidth_manager --ros-args -p config_file:=/ws/src/bandwidth_manager/config/bandwidth_config.yaml
      "

  # --------------------------------------------------------
  # BANDWIDTH MANAGER (adaptive FPS control)
  # --------------------------------------------------------
  perception:
    image: robot_edge_stack_base:humble
    network_mode: host
    restart: unless_stopped
    runtime: nvidia
    environment: 
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/ws/fastdds/jetson_fastdds.xml
    volumes:
      - ./:/ws:rw
    depends_on:
      - discovery
      - camera_front
    command: |
      bash -lc "
        cd /ws &&
        colcon build --packages-select perception --cmake-args -DCMAKE_BUILD_TYPE=Release && 
        source install/setup.bash &&
        ros2 run perception perception_node 
      "