services:
  operator:
    build:
      context: .
      dockerfile: docker/operator/Dockerfile.operator
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/ws/fastdds/operator_fastdds.xml
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ./:/ws:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /ws
    tty: true
    stdin_open: true

  # --------------------------------------------------------
  # NETWORK MONITOR (measures latency/loss from laptop side)
  # --------------------------------------------------------
  network_monitor:
    build:
      context: .
      dockerfile: docker/operator/Dockerfile.operator
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/ws/fastdds/operator_fastdds.xml
    volumes:
      - ./:/ws:rw
    command: | 
      bash -lc "
        cd /ws &&
        colcon build --packages-select stack_msgs health_monitor --cmake-args -DCMAKE_BUILD_TYPE=Release &&
        source install/setup.bash &&
        ros2 run health_monitor network_monitor --ros-args -p jetson_ip:=192.168.1.100 -p ethernet_interface:=enp8s0
      "