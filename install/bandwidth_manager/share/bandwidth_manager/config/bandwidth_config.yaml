# How often to evaluate conditions (seconds)
evaluation_period_sec: 2.0

# Minimum time between mode changed to prevent oscillation (seconds)
mode_change_cooldown_sec: 5.0

thresholds:
  # Network quality score (0-100, from NetworkHealth.quality_score)
  quality_degraded: 70 # below this -> DEGRADED
  quality_critical: 40 # below this -> CRITICAL

  # Packet loss percentage (from NetworkHealth.packet_loss_percent)
  packet_loss_degraded: 2.0
  packet_loss_critical: 5.0

  # Available bandwidth in Mbps (from NetworkHealth.available_bandwidth)
  bandwidth_low_mbps: 10.0 # below this -> DEGRADED

  # System load (from SystemMetrics)
  cpu_high: 80.0 # above this -> DEGRADED
  gpu_high: 85.0 # above this -> DEGRADED
  temp_critical: 85.0 # above this -> CRITICAL (either CPU or GPU) 