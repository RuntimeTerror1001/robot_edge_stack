services:
  discovery:
    image: ros:humble-ros-core
    network_mode: host
    restart: always
    environment:
      - ROS_DOMAIN_ID=42
    command: >
      bash -lc "
        apt-get update &&
        apt-get install -y fastdds-tools &&
        fastdds discovery -i 0 -l 192.168.1.100 -p 11811
      "

  skeleton:
    image: ros:humble-ros-core
    network_mode: host
    restart: always
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/root/.fastdds/fastdds.xml
    volumes:
      - /home/redpaladin/.fastdds:/root/.fastdds:ro
    command: >
      bash -lc "
        ros2 topic pub /heartbeat std_msgs/msg/String \"{data: 'alive'}\" -r 1
      "
    depends_on:
      - discovery
