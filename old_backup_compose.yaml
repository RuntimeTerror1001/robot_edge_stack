services:
  discovery:
    image: ros:humble-ros-core
    network_mode: host
    restart: always
    environment:
      - ROS_DOMAIN_ID=42
      - FASTRTPS_DEFAULT_PROFILES_FILE=/root/.fastdds/server_fastdds.xml
    volumes:
      - /home/redpaladin/.fastdds:/root/.fastdds:ro
    command: >
      bash -lc "
        apt-get update &&
        apt-get install -y fastdds-tools &&
        fastdds discovery -i 0
      "

  skeleton:
    image: ros:humble-ros-core
    network_mode: host
    restart: always
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/root/.fastdds/fastdds.xml
    volumes:
      - /home/redpaladin/.fastdds:/root/.fastdds:ro
    command: >
      bash -lc "
        ros2 topic pub /heartbeat std_msgs/msg/String \"{data: 'alive'}\" -r 1
      "
    depends_on:
      - discovery

  camera_front:
    image: ros:humble-ros-base
    network_mode: host
    restart: always
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/root/.fastdds/fastdds.xml
    volumes:
      - /home/redpaladin/.fastdds:/root/.fastdds:ro
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
    group_add:
      - video
    command:
      - bash
      - -lc
      - |
        apt-get update &&
        apt-get install -y ros-humble-usb-cam &&
        ros2 run usb_cam usb_cam_node_exe \
          --ros-args \
          -r "__ns:=/front_camera" \
          -r "__node:=usb_cam_front" \
          -p "video_device:=/dev/video0" \
          -p "image_width:=640" \
          -p "image_height:=480" \
          -p "framerate:=30.0" \
          -p "pixel_format:=mjpeg2rgb" \
          -p "camera_name:=front_camera"
    depends_on:
      - discovery

  camera_rear:
    image: ros:humble-ros-base
    network_mode: host
    restart: always
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/root/.fastdds/fastdds.xml
    volumes:
      - /home/redpaladin/.fastdds:/root/.fastdds:ro
    devices:
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
    group_add:
      - video
    command:
      - bash
      - -lc
      - |
        apt-get update &&
        apt-get install -y ros-humble-usb-cam &&
        ros2 run usb_cam usb_cam_node_exe \
          --ros-args \
          -r "__ns:=/rear_camera" \
          -r "__node:=usb_cam_rear" \
          -p "video_device:=/dev/video2" \
          -p "image_width:=640" \
          -p "image_height:=480" \
          -p "framerate:=30.0" \
          -p "pixel_format:=mjpeg2rgb" \
          -p "camera_name:=rear_camera"
    depends_on:
      - discovery
